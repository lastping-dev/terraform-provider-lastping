          description: |
            `24h`, `7d` (default) or `30d`. The data is daily, so a range
            covers every UTC day that overlaps it: `24h` reads yesterday and
            today.
          schema:
            type: string
            enum: ["24h", "7d", "30d"]
            default: "7d"
