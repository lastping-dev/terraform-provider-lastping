name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Acceptance tests (`make testacc`) are intentionally not run here: they
# require a live LastPing backend and are wired up separately from the
# monorepo's CI.

jobs:
  build:
    name: Build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Vet
        run: go vet ./...

      - name: Test
        run: make test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  docs:
    name: Docs up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # tfplugindocs drives a real `terraform init`, so the CLI has to be on PATH.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Check generated docs are current
        run: |
          make docs
          git diff --exit-code -- docs/
